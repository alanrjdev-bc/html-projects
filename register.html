<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <link rel="stylesheet" href="register.css">
</head>
<body style>
<div class="holder">
<form action="succes.html">

    <h4>REGISTRATION FORM</h4>
   
    <input type="text" placeholder="Enter name" required><br><br>

    <input type="email" placeholder="Enter email" required><br><br>

    <input type="password" placeholder="Enter password" required maxlength="8"><br><br>

    <input type="tel" placeholder="Enter phone number" required maxlength="10"
    pattern="[0-9]{10}"><br><br>
    
   <button type="submit">Register</button>

</form>
</div>
    
</body>
</html>
